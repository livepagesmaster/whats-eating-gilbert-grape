<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>All Blogs — Yashintv</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    max-width: 900px; margin: 40px auto; padding: 0 20px;
    background: #f4f6f9; color: #1f2937; line-height: 1.6;
  }
  .back { display: inline-block; margin-bottom: 20px; color: #4338ca; text-decoration: none; font-weight: 500; font-size: 0.9rem; }
  .back:hover { text-decoration: underline; }
  h1 { font-size: 1.8rem; margin: 0 0 1.5rem; }
  .blog-list { background:#fff; border:1px solid #e5e7eb; border-radius:10px; overflow:hidden; box-shadow: 0 5px 35px rgba(0,0,0,.05); }
  .blog-item { display:block; padding:18px 24px; border-bottom:1px solid #e5e7eb; text-decoration:none; color:inherit; transition:background .15s; }
  .blog-item:last-child { border-bottom:0; }
  .blog-item:hover { background:#eaeaea; }
  .blog-item h2 { font-size:1.1rem; margin:0 0 6px; color:#1f2937; }
  .blog-item:hover h2 { color:#4338ca; }
  .blog-item p { font-size:13.5px; color:#6b7280; margin:0 0 6px; line-height:1.55; }
  .blog-item .meta { font-size:12.5px; color:#9ca3af; }
  .empty { padding: 30px; color:#6b7280; text-align:center; }
</style>
</head>
<body>
  <a href="../" class="back">← Back to home</a>
  <h1>All Blogs</h1>
  <div class="blog-list" id="allBlogs"><div class="empty">Loading…</div></div>

  <script>
  (async function () {
    const FEED = 'https://football-feed.pages.dev/blogs.json';
    const container = document.getElementById('allBlogs');

    try {
      const res = await fetch(FEED, { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const list = Array.isArray(data.all) ? data.all : (Array.isArray(data.latest) ? data.latest : []);

      if (!list.length) {
        container.innerHTML = '<div class="empty">No blogs yet.</div>';
        return;
      }

      list.sort((a, b) => (b.date || '').localeCompare(a.date || ''));

      container.innerHTML = list.map(b => {
        const raw = b.file || (b.slug + '.html');
        const cleaned = raw.replace(/^\/+/, '').replace(/^blogs\//, '').replace(/\.html$/, '');
        return `
          <a class="blog-item" href="${cleaned}">
            <h2>${esc(b.title || 'Untitled')}</h2>
            <p>${esc(b.snippet || '')}</p>
            <div class="meta">${esc(b.date || '')} · By Admin</div>
          </a>`;
      }).join('');
    } catch (err) {
      container.innerHTML = '<div class="empty">Could not load blogs.</div>';
      console.error(err);
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  })();
  </script>
</body>
</html>
